name: PhantomDep PR Gate
on:
  pull_request:
    paths:
      - "package.json"
      - "requirements.txt"
      - "pyproject.toml"
permissions:
  contents: read
  pull-requests: write
jobs:
  phantomdep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: RakTikoo/phantomdep-pr-gate@v0.2
        with:
          live: "true"
